<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 12px; }
</style>
<link rel="stylesheet" href="../../src/tabbed-ui/index.css" />
<script type="module" src="../../src/tabbed-ui/global.mjs"></script>
</head>
<body>
<tabbed-ui>
  <div>
    <button>One</button>
    <button>Two</button>
    <button aria-disabled="true">Disabled</button>
    <button>Four</button>
  </div>
  <section>Panel one. Focus a tab and use ←/→, Home, and End.</section>
  <section>Panel two: the tab list and panels match by position.</section>
  <section>Never shown: its tab is disabled.</section>
  <section>Panel four. Hidden panels use the <code>hidden</code> attribute.</section>
</tabbed-ui>
</body>
</html>
