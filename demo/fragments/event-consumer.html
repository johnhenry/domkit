<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 12px; }
  #log { margin-top: 8px; font-family: ui-monospace, monospace; font-size: 12px; color: #333; min-height: 3em; border: 1px solid #ccc; padding: 6px; border-radius: 4px; }
  button { font: inherit; padding: 6px 12px; }
</style>
<script type="module" src="../../src/event-consumer/global.mjs"></script>
</head>
<body>
<p>Declaratively wires listeners onto children without any setup code —
click or focus+keydown the button below:</p>
<event-consumer events="click,keydown" onevent="window.__log(event.type)">
  <button>Click or focus+key me</button>
</event-consumer>
<div id="log"></div>
<script>
  window.__log = (type) => {
    const el = document.getElementById("log");
    el.textContent = `[${new Date().toLocaleTimeString()}] ${type}\n` + el.textContent;
  };
</script>
</body>
</html>
