<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 12px; }
  dialog { border-radius: 8px; border: 1px solid #888; padding: 16px; }
  dialog::backdrop { background: rgba(0,0,0,0.3); }
  kbd { border: 1px solid #aaa; border-radius: 3px; padding: 0 4px; font-size: 0.9em; }
</style>
<script type="module" src="../../src/hotkey-dialog/global.mjs"></script>
</head>
<body>
<p>Click into this frame, then press <kbd>Ctrl/⌘ K</kbd> or <kbd>/</kbd>
(not while typing in the field).</p>
<input placeholder="typing / here doesn't open it" />
<hotkey-dialog hotkey="mod+k /">
  <dialog closedby="any">
    <form method="dialog">
      <p>Press the shortcut again, click outside, or press Esc.</p>
      <button>Close</button>
    </form>
  </dialog>
</hotkey-dialog>
</body>
</html>
