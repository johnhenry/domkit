<head>

  body { font: 14px/1.5 system-ui, sans-serif; margin: 12px; }

</style>
<link rel="stylesheet" href="../../src/code-color/index.css" />

<code-color>
<pre><code class="language-js">// The text is untouched: select and copy it.

<pre contenteditable spellcheck="false">/* Editable: it re-highlights as you type */
