<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 12px; }
  dialog { border-radius: 8px; border: 1px solid #888; padding: 16px; }
  dialog::backdrop { background: rgba(0,0,0,0.3); }
</style>
<script
  type="module"
  src="../../src/hotkey-modal-dialog/global.mjs"
></script>
</head>
<body>
<p>Click into this frame, then press <kbd>Ctrl+K</kbd> to open/close, or
click outside the dialog.</p>
<dialog is="hotkey-modal" hotkey="ctrl+k" click-to-close>
  <p>Press <kbd>Ctrl+K</kbd> again, click outside, or Esc to close.</p>
</dialog>
</body>
</html>
