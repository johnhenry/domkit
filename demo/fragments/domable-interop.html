<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 12px; }
  textarea { width: 100%; box-sizing: border-box; font-family: ui-monospace, monospace; font-size: 12px; }
  pre { background: #1e1e1e; color: #ddd; padding: 8px; border-radius: 6px; overflow: auto; font-size: 12px; }
  #rendered { border: 1px dashed #888; padding: 8px; margin-top: 4px; }
  button { font: inherit; padding: 6px 12px; margin: 6px 0; }
</style>
</head>
<body>
<p><code>domkit</code> has no DOM⇄React conversions of its own — it
depends on <a href="https://github.com/johnhenry/domable">domable</a> for
them. Round-trip: HTML text &rarr; DOM &rarr; a React-element-shaped plain
object &rarr; back to DOM.</p>
<textarea id="src" rows="2">&lt;div class="card"&gt;&lt;strong&gt;hi&lt;/strong&gt; there&lt;/div&gt;</textarea>
<button id="run">Convert</button>
<h4>domToReact() output</h4>
<pre id="react-out"></pre>
<h4>reactToDom() rendered back</h4>
<div id="rendered"></div>
<script type="module">
  import { textToDom, domToReact, reactToDom } from "https://esm.sh/@johnhenry/domable";

  document.getElementById("run").onclick = () => {
    const html = document.getElementById("src").value;
    const frag = textToDom(html);
    const react = domToReact(frag.firstChild);
    document.getElementById("react-out").textContent = JSON.stringify(
      react,
      (key, value) => (key === "$$typeof" ? String(value) : value),
      2,
    );
    const rendered = document.getElementById("rendered");
    rendered.replaceChildren(reactToDom(react));
  };
  document.getElementById("run").click();
</script>
</body>
</html>
