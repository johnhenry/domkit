<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 12px; }
  menu-component { display: block; border: 1px solid #888; border-radius: 8px; padding: 8px; }
  menu-component [part="item"] { display: block; padding: 6px 8px; cursor: pointer; border-radius: 4px; }
  menu-component [part="item"]:hover, menu-component [part="item"]:focus { background: #eef; outline: none; }
  menu-component [part="content"] p { margin: 4px 0; }
  button.back { font: inherit; margin-top: 8px; }
  small { color: #666; }
</style>
<script type="module">
  import MenuComponent from "../../src/menu-component.component/index.mjs";
  import { attach } from "../../src/menu-component.component/hash.mjs";

  customElements.define("menu-component", MenuComponent);

  window.addEventListener("DOMContentLoaded", () => {
    attach(document.getElementById("menu"));
  });
</script>
</head>
<body>
<p>Keyboard-navigable (arrow keys + enter/space), stateful menu.
Activating an item with a <code>&lt;template&gt;</code> "pushes" its
content into view and syncs <code>location.hash</code> (via
<code>hash.mjs</code>'s <code>attach()</code>); a button inside the
template dispatches the <code>end</code> event to pop back.</p>
<small>Current hash: <code id="hash"></code></small>
<menu-component id="menu">
  <div data-key="profile">
    Profile
    <template>
      <p>Your profile: <strong>demo user</strong>.</p>
      <button class="back" onclick="this.dispatchEvent(new Event('end', {bubbles: true}))">&larr; Back</button>
    </template>
  </div>
  <div data-key="settings">
    Settings
    <template>
      <p>Settings content goes here.</p>
      <button class="back" onclick="this.dispatchEvent(new Event('end', {bubbles: true}))">&larr; Back</button>
    </template>
  </div>
</menu-component>
<script type="module">
  const hashEl = document.getElementById("hash");
  const update = () => (hashEl.textContent = location.hash || "(none)");
  window.addEventListener("hashchange", update);
  update();
</script>
</body>
</html>
