<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 12px; }
  button { font: inherit; padding: 6px 12px; margin-right: 6px; }
  #count { font-family: ui-monospace, monospace; font-size: 20px; }
</style>
<script type="module">
  import "../../src/internal-timer/global.mjs";

  window.addEventListener("DOMContentLoaded", () => {
    const clock = document.getElementById("clock");
    const countEl = document.getElementById("count");
    let ticks = 0;
    clock.addEventListener("tick", () => {
      ticks++;
      countEl.textContent = ticks;
    });
    clock.addEventListener("paused", () => {
      countEl.textContent += " (paused)";
    });
    document.getElementById("pause-1s").onclick = () =>
      clock.dispatchEvent(new CustomEvent("pause", { detail: 1000 }));
    document.getElementById("pause").onclick = () =>
      clock.dispatchEvent(new CustomEvent("pause"));
  });
</script>
</head>
<body>
<p>Dispatches a bubbling <code>tick</code> event every frame (paced to
<code>fps</code>) while connected:</p>
<!-- internal-timer only starts ticking once its internal (hidden) <slot>
     receives a slotchange event, which requires actual light-DOM content
     to assign -- an empty element never ticks at all. -->
<internal-timer fps="10" id="clock">running</internal-timer>
<div>Ticks: <span id="count">0</span></div>
<button id="pause-1s">Pause for 1s</button>
<button id="pause">Pause indefinitely</button>
</body>
</html>
