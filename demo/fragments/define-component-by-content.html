<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 12px; }
  my-greeting { display: block; padding: 8px; border: 1px dashed #888; margin-top: 8px; }
</style>
<script
  type="module"
  src="../../src/define-component-by-content.component/global.mjs"
></script>
</head>
<body>
<p>A custom element defined entirely from an HTML string attribute, no separate module file:</p>
<define-component-by-content
  name="my-greeting"
  content="&lt;p&gt;Hello from &lt;strong&gt;define-component-by-content&lt;/strong&gt;!&lt;/p&gt;"
></define-component-by-content>
<my-greeting></my-greeting>
</body>
</html>
