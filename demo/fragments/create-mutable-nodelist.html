<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 12px; }
  button { font: inherit; padding: 6px 12px; margin-right: 6px; }
  #items div { display: inline-block; padding: 4px 8px; margin: 2px; background: #efe; border-radius: 4px; }
</style>
<script type="module">
  import createMutableNodeList from "../../src/create-mutable-nodelist/index.mjs";

  window.addEventListener("DOMContentLoaded", () => {
    const itemsEl = document.getElementById("items");
    let n = 0;
    const makeNode = (label) => {
      const div = document.createElement("div");
      div.textContent = label;
      return div;
    };

    const list = createMutableNodeList(makeNode("a"), makeNode("b"), makeNode("c"));
    const render = () => {
      itemsEl.replaceChildren(...list);
      document.getElementById("length").textContent = list.length;
    };
    render();

    document.getElementById("push").onclick = () => {
      n++;
      list.push(makeNode(`push-${n}`));
      render();
    };
    document.getElementById("unshift").onclick = () => {
      n++;
      list.unshift(makeNode(`unshift-${n}`));
      render();
    };
    document.getElementById("shift").onclick = () => {
      list.shift();
      render();
    };
  });
</script>
</head>
<body>
<p>A mutable "subclass" of <code>NodeList</code> -- adds
<code>push</code>/<code>pull</code>/<code>shift</code>/<code>unshift</code>:</p>
<div id="items"></div>
<div>length: <span id="length"></span></div>
<button id="push">push</button>
<button id="unshift">unshift</button>
<button id="shift">shift</button>
</body>
</html>
