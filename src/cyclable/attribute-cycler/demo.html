<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  html { font: 14px/1.5 system-ui, sans-serif; color-scheme: light; }
  html.dark { color-scheme: dark; }
  html.sepia { background: #f4ecd8; color: #5b4636; }
  body { margin: 12px; }
  button { font: inherit; padding: 6px 12px; margin: 0 6px 6px 0; }
  button[aria-pressed="true"] { font-weight: 700; }
</style>
<script type="module" src="./global.mjs"></script>
</head>
<body>
<attribute-cycler id="theme" target="html" values="light,dark,sepia" storage-key="cyclable-demo-theme">
  <button>Next theme</button>
  <button data-cycle="previous">Previous</button>
  <br />
  <button value="light">Light</button>
  <button value="dark">Dark</button>
  <button value="sepia">Sepia</button>
  <p>Current: <output></output>. It's saved to localStorage, so reload the page, or open it in a second tab and watch them stay in sync.</p>
</attribute-cycler>
<p>A button outside the element, using an invoker command:
  <button commandfor="theme" command="--next">Next (commandfor)</button></p>
</body>
</html>
