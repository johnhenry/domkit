<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>body { font: 14px/1.5 system-ui, sans-serif; margin: 12px; }</style>
<script type="module" src="./global.mjs"></script>
</head>
<body>
<p>From a module (<code>src</code>, registering its default export):</p>
<define-component name="my-widget" src="./demo-widget.mjs"></define-component>
<my-widget></my-widget>

<p>From markup written right here, with no module file:</p>
<define-component name="x-callout">
  <template>
    <style>
      :host { display: block; border-inline-start: 4px solid teal; padding: 4px 12px; margin-block: 8px; }
      ::slotted(strong) { color: teal; }
    </style>
    <slot></slot>
  </template>
</define-component>

<define-component name="x-signature" mode="none">
  <template><p><em>— the domkit team</em></p></template>
</define-component>

<x-callout><strong>Heads up:</strong> scoped styles and slots work, because the markup lives in a shadow root.</x-callout>
<x-callout>Each instance renders the same template.</x-callout>
<x-signature></x-signature>
</body>
</html>
