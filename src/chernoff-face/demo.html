<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>chernoff-face</title>
<link rel="stylesheet" href="../theme.css" />
<link rel="stylesheet" href="./index.css" />
<link rel="stylesheet" href="../scatter-plot/index.css" />
<script type="module" src="./global.mjs"></script>
<script type="module" src="../scatter-plot/global.mjs"></script>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 12px; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
  figure { margin: 0; text-align: center; }
  scatter-plot { inline-size: 320px; block-size: 200px; margin-block-start: 16px; }
  scatter-plot chernoff-face { inline-size: 32px; block-size: 32px; }
</style>
</head>
<body>
<div class="row">
  <figure><chernoff-face></chernoff-face><figcaption>neutral</figcaption></figure>
  <figure><chernoff-face smile="1" eye-size="0.7" brow-slant="0.7"></chernoff-face><figcaption>happy</figcaption></figure>
  <figure><chernoff-face smile="0" brow-slant="0" eye-size="0.3" pupil-size="0.2"></chernoff-face><figcaption>cross</figcaption></figure>
  <figure><chernoff-face mouth-open="1" eye-size="1" pupil-size="0.2" brow-slant="1" smile="0.6"></chernoff-face><figcaption>surprised</figcaption></figure>
  <figure><chernoff-face gaze="1" smile="0.4" brow-slant="0.2" eye-size="0.4"></chernoff-face><figcaption>suspicious</figcaption></figure>
</div>

<p>Faces as points: a <code>&lt;scatter-plot&gt;</code> whose template is a <code>&lt;chernoff-face&gt;</code>. Each data item's extra keys become the face's features.</p>
<scatter-plot id="plot" x-max="10" y-max="10" aria-label="Ten teams: velocity against morale">
  <template><chernoff-face></chernoff-face></template>
</scatter-plot>
<script type="module">
  const random = (seed) => () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const next = random(7);
  document.getElementById("plot").data = Array.from({ length: 10 }, (_, i) => ({
    x: 0.5 + i,
    y: 1 + next() * 8,
    smile: next().toFixed(2),
    "eye-size": next().toFixed(2),
    "brow-slant": next().toFixed(2),
    "aria-label": `Team ${i + 1}`,
  }));
</script>
</body>
</html>
