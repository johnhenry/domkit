<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script type="importmap">
      {
        "imports": {
          "@johnhenry/definable/": "../../node_modules/@johnhenry/definable/src/"
        }
      }
    </script>
    <script type="module">
      import defineXyGrapher from "./define.mjs";
      defineXyGrapher("xy-grapher");
      window.onload = () => {
        const grapher = document.createElement("xy-grapher");
        grapher.setAttribute("xmax", "10");
        grapher.setAttribute("ymax", "10");
        grapher.setAttribute(
          "data",
          JSON.stringify([
            [1, 2],
            [3, 5],
            [5, 3],
            [7, 8],
            [9, 4],
          ]),
        );
        document.body.appendChild(grapher);
      };
    </script>
    <style>
      xy-grapher {
        display: block;
        width: 256px;
        height: 256px;
      }
    </style>
  </head>
  <body></body>
</html>
