<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>xy-grapher</title>
    <script type="module">
      import defineXyGrapher from "./define.mjs";
      defineXyGrapher("xy-grapher");
      const sine = document.getElementById("sine");
      sine.setAttribute(
        "data",
        JSON.stringify(
          Array.from({ length: 41 }, (_, i) => ({
            x: i / 4,
            y: 5 + 4 * Math.sin(i / 4),
          })),
        ),
      );
    </script>
    <style>
      body {
        font: 14px/1.5 system-ui, sans-serif;
        margin: 12px;
        display: flex;
        gap: 24px;
        flex-wrap: wrap;
      }
      xy-grapher {
        width: 200px;
        height: 200px;
        border-left: 1px solid #999;
        border-bottom: 1px solid #999;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #2a6;
      }
      .dot[data-label]::after {
        content: attr(data-label);
        position: absolute;
        left: 10px;
        top: -6px;
        font-size: 11px;
      }
      .tiny {
        width: 3px;
        height: 3px;
        background: #c33;
      }
    </style>
  </head>
  <body>
    <figure>
      <!-- first child element = the template cloned for each point;
           non-x/y keys become attributes on the clone -->
      <xy-grapher
        xmax="10"
        ymax="10"
        data='[[1, 2], [3, 5], {"x": 5, "y": 3, "data-label": "five"}, [7, 8], [9, 4]]'
      >
        <div class="dot"></div>
      </xy-grapher>
      <figcaption>[x, y] pairs and {x, y, …attrs} objects</figcaption>
    </figure>
    <figure>
      <xy-grapher id="sine" xmax="10" ymax="10">
        <div class="dot tiny"></div>
      </xy-grapher>
      <figcaption>41 points of a sine wave</figcaption>
    </figure>
  </body>
</html>
