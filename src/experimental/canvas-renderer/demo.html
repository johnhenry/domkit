<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>render pipeline</title>
    <script type="module">
      import CanvasRenderer from "./index.mjs";
      import { zoom, grid } from "../pixel-shader/index.mjs";
      import ImagedataEmitter from "../imagedata-emitter/index.mjs";
      customElements.define("canvas-renderer", CanvasRenderer);
      customElements.define("pixel-zoom", zoom);
      customElements.define("pixel-grid", grid);
      customElements.define("imagedata-emitter", ImagedataEmitter);
    </script>
    <style>
      body {
        font: 14px/1.5 system-ui, sans-serif;
        margin: 12px;
      }
      figure {
        display: inline-block;
        margin: 0 24px 0 0;
        vertical-align: top;
      }
      canvas {
        background: #eee;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <p>
      A <code>render</code>-event pipeline: the innermost element emits an
      <code>ImageData</code> (a 6×6 smiley) once a second; each shader
      element catches the event, transforms the pixels, and re-dispatches
      it to its parent; <code>canvas-renderer</code> draws whatever reaches
      it.
    </p>
    <figure>
      <canvas-renderer width="6" height="6">
        <imagedata-emitter></imagedata-emitter>
      </canvas-renderer>
      <figcaption>raw (6×6)</figcaption>
    </figure>
    <figure>
      <canvas-renderer width="72" height="72">
        <pixel-zoom value="12">
          <imagedata-emitter></imagedata-emitter>
        </pixel-zoom>
      </canvas-renderer>
      <figcaption>zoom ×12</figcaption>
    </figure>
    <figure>
      <canvas-renderer width="72" height="72">
        <pixel-grid width="12" height="12">
          <pixel-zoom value="12">
            <imagedata-emitter></imagedata-emitter>
          </pixel-zoom>
        </pixel-grid>
      </canvas-renderer>
      <figcaption>zoom ×12, then grid</figcaption>
    </figure>
  </body>
</html>
