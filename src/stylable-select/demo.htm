<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>stylable-select</title>
    <link rel="stylesheet" href="./index.css" />
    <script type="module" src="./global.mjs"></script>
    <style>
      body {
        font: 14px/1.5 system-ui, sans-serif;
        margin: 12px;
      }
      stylable-select {
        height: 180px;
        width: 260px;
        border: 1px solid #ccc;
        border-radius: 8px;
        grid-auto-rows: auto;
      }
      stylable-select:focus-within,
      stylable-select:focus {
        outline: 2px solid #4a8;
      }
      optgroup {
        display: block;
        font-size: 12px;
        color: #888;
        padding: 6px 8px 2px;
        overflow: visible;
      }
      stylable-select :is(option, [role="option"]) {
        display: flex;
        gap: 6px;
        padding: 4px 8px;
        font-size: 14px;
        color: #222;
      }
      stylable-select :is(option, [role="option"])::before {
        content: "○";
      }
      stylable-select :is(option, [role="option"])[data-checked] {
        background: #2a6;
        color: white;
        border-radius: 4px;
      }
      stylable-select :is(option, [role="option"])[data-checked]::before {
        content: "●";
      }
    </style>
  </head>
  <body>
    <p>
      Click an option, or focus the list and use the arrow keys. Plain
      <code>&lt;option&gt;</code> children (or any element with
      <code>role="option"</code>) are selectable, and every one of them can be
      styled, including <code>::before</code> content.
    </p>
    <stylable-select id="select" tabindex="0">
      <optgroup label="Fruit">
        <option value="apple">Apple</option>
        <option value="banana">Banana</option>
        <option value="cherry">Cherry</option>
      </optgroup>
      <optgroup label="Vegetables">
        <option value="carrot">Carrot</option>
        <option value="leek">Leek</option>
        <div role="option" data-value="okra">Okra (a div with role="option")</div>
      </optgroup>
    </stylable-select>
    <p>value: <output id="value">(none)</output></p>
    <script type="module">
      const select = document.getElementById("select");
      select.addEventListener("change", ({ detail }) => {
        document.getElementById("value").textContent = detail;
      });
    </script>
  </body>
</html>
